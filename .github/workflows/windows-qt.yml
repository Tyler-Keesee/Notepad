name: Windows PyQt clean clone checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements in a clean interpreter
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python source syntax
        run: python -m compileall -q main.py
      - name: Check Qt import with offscreen backend
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PyQt6.QtWidgets import QApplication;app=QApplication([]);print('PyQt6 QApplication imported and created')"
